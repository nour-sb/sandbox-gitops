<title>Observability Stack</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0d1117;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 32px;
  min-height: 100vh;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
}
h1 {
  color: #8b949e;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin: 0 0 16px;
}
svg { width: min(1100px, 100%); height: auto; }

@keyframes flow { to { stroke-dashoffset: -28; } }

.flow {
  fill: none;
  stroke-width: 1.8;
  stroke-dasharray: 8 6;
  animation: flow 1s linear infinite;
}
.f-blue   { stroke: #4fc3f7; }
.f-green  { stroke: #56d364; animation-duration: 1.3s; }
.f-purple { stroke: #bc8cff; stroke-width: 2.4; animation-duration: 0.72s; }
.f-orange { stroke: #f0883e; animation-duration: 1.45s; }
.f-red    { stroke: #ff7b72; animation-duration: 2.2s; }
.f-teal   { stroke: #39d0d8; animation-duration: 1.1s; }

svg a { cursor: pointer; }
svg a rect { transition: filter 0.15s ease, stroke-width 0.15s ease; }
svg a:hover rect { filter: brightness(1.35) drop-shadow(0 0 6px currentColor); stroke-width: 2.5; }

.legend { display: flex; gap: 22px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
.leg { display: flex; align-items: center; gap: 7px; font-size: 10px; font-family: monospace; }
.leg-line { width: 26px; height: 2px; border-radius: 1px; }
.hint { color: #484f58; font-size: 10px; margin-top: 10px; font-family: monospace; }
</style>
</head>
