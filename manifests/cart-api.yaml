apiVersion: v1
kind: ConfigMap
metadata:
  name: cart-api-config
  namespace: default
data:
  default.conf: |
    server {
      listen 80;
      location / {
        default_type application/json;
        return 200 '{"user_id":"usr-7291","items":[{"product_id":"p-001","name":"Chicken Shawarma","qty":2,"unit_price":4.99},{"product_id":"p-003","name":"Cola 330ml","qty":2,"unit_price":1.29}],"subtotal":12.56,"currency":"AED"}';
      }
      location /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"cart-api"}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-api
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-api
  template:
    metadata:
      labels:
        app: cart-api
    spec:
      containers:
      - name: cart-api
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: cart-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: cart-api
  namespace: default
spec:
  type: NodePort
  selector:
    app: cart-api
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
